<!doctype html>
<!-- bike sharing demand dashboard, the website version that runs on github pages -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bike-share demand</title>
  <meta name="description" content="A ride journal of Capital Bikeshare rental demand, 2011–2012: an interactive dashboard by Adam Garantche">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
  <!-- fonts: fraunces for headings, karla for reading, caveat for the handwritten notes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Karla:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- picks light or dark mode before the page shows, so it doesnt flash white -->
  <script>
    try {
      const saved = localStorage.getItem("bk-theme");
      document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <!-- vega-lite draws the charts (the same chart system altair used in the python version) -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div class="app">
    <aside id="side" class="side"></aside>
    <main class="main">
      <div id="filters" class="filters" hidden></div>
      <div id="page"><p class="loading">Opening the journal…</p></div>
      <div id="foot"></div>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
